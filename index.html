<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro ATM Mapping form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background-color: white !important; padding: 0 !important; }
      .no-print { display: none !important; }
      #closedScreen { border: none !important; box-shadow: none !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
    <!-- Header -->
    <div class="bg-blue-700 text-white px-6 py-5 flex flex-col md:flex-row md:items-center md:justify-between gap-2 no-print">
      <div>
        <h1 class="text-2xl font-bold">Micro ATM Mapping form</h1>
      </div>
      <div id="syncStatus" class="text-xs bg-blue-800 px-3 py-1.5 rounded-full text-blue-100 hidden"></div>
    </div>

    <!-- Loading Indicator -->
    <div id="loader" class="p-8 text-center text-blue-600 font-semibold no-print">
      Loading Location Mapping & Verification Data... Please wait.
    </div>

    <!-- Main Form -->
    <form id="vleForm" class="p-6 space-y-6 hidden no-print">
      
      <!-- Section 1: Location Mapping -->
      <div>
        <h2 class="text-lg font-semibold text-slate-800 border-b pb-2 mb-4">1. Location Mapping Details</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Location Type *</label>
            <select id="locationType" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500">
              <option value="">-- Select Location Type --</option>
              <option value="Rural">Rural</option>
              <option value="Urban">Urban</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">District Name (Code) *</label>
            <select id="district" required disabled class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50">
              <option value="">-- Select District --</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Block Name (Code) *</label>
            <select id="block" required disabled class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50">
              <option value="">-- Select Block --</option>
            </select>
          </div>

          <div>
            <label id="gpCityLabel" class="block text-sm font-medium text-slate-700 mb-1">Gram Panchayat / City (Code) *</label>
            <select id="gpOrCity" required disabled class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50">
              <option value="">-- Select --</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label id="villageWardLabel" class="block text-sm font-medium text-slate-700 mb-1">Village / Ward Name & Number (Code) *</label>
            <select id="villageOrWard" required disabled class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50">
              <option value="">-- Select --</option>
            </select>
          </div>

        </div>
      </div>

      <!-- Section 2: VLE & Center Details -->
      <div>
        <h2 class="text-lg font-semibold text-slate-800 border-b pb-2 mb-4">2. VLE & Center Details</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">CSC ID (12 Digits) *</label>
            <input type="text" id="cscId" maxlength="12" inputmode="numeric" required placeholder="e.g. 657361150019"
              class="w-full border border-slate-300 rounded-lg p-2.5 font-mono">
            <p id="cscError" class="text-xs text-red-600 font-semibold mt-1 hidden"></p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">VLE First Name *</label>
            <input type="text" id="firstName" required placeholder="FIRST NAME"
              class="w-full border border-slate-300 rounded-lg p-2.5 uppercase">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">VLE Last Name *</label>
            <input type="text" id="lastName" required placeholder="LAST NAME"
              class="w-full border border-slate-300 rounded-lg p-2.5 uppercase">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">VLE Mobile Number *</label>
            <input type="tel" id="mobile" maxlength="10" inputmode="numeric" pattern="[6-9]\d{9}" required placeholder="10-digit Mobile"
              class="w-full border border-slate-300 rounded-lg p-2.5">
            <p id="mobileError" class="text-xs text-red-600 font-semibold mt-1 hidden"></p>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">VLE Mail ID *</label>
            <input type="email" id="email" required placeholder="example@gmail.com"
              class="w-full border border-slate-300 rounded-lg p-2.5">
            <p id="emailError" class="text-xs text-red-600 font-semibold mt-1 hidden"></p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Center Name *</label>
            <input type="text" id="centerName" required placeholder="CSC CENTER NAME"
              class="w-full border border-slate-300 rounded-lg p-2.5 uppercase">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Center Address *</label>
            <input type="text" id="centerAddress" required placeholder="FULL CENTER ADDRESS"
              class="w-full border border-slate-300 rounded-lg p-2.5 uppercase">
